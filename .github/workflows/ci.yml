name: API CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore ZiApp.sln --locked-mode

      - name: Build
        run: dotnet build ZiApp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test ZiApp.sln --configuration Release --no-build
